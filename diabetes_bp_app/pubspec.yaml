name: diabetes_bp_app
description: "Affordable IoT-Based Mobile Application for Real-Time Diabetes and Hypertension Chronic Disease Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.6.12

  # Charts
  fl_chart: ^0.69.0

  # State management (simple, lightweight)
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
